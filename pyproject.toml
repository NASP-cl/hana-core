[project]
name = "hana-core"
version = "0.1.0"
description = "Contrato de capas, registro y verbos comunes de los servicios de HANA"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
